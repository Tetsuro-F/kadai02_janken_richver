<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>じゃんけんアラーム</title>
    <link rel="stylesheet" href="css/alarm.css">
    
</head>

<body>
    <header>
        <h1>じゃんけんアラーム</h1>
    </header>

    <main>
        <!-- 現在時刻表示 -->
        <section class="clock-section">
            <div id="clock" class="clock">
                00:00:00
            </div>
        </section>

        <!-- アラーム設定 -->
        <section class="alarm-section">
            <h2>アラーム設定</h2>
            <div class="alarm-controls">
                <input type="time" id="alarm-time">
                <button id="set-alarm">
                    アラームセット
                </button>
                <button id="clear-alarm">
                    解除
                </button>
            </div>
            <p id="alarm-status" class="alarm-status">
                アラームは未設定です
            </p>
        </section>

        <!-- アラーム音 -->
        <audio id="alarm-sound" src="alarm.mp3" preload="auto"></audio>



        <!-- じゃんけん -->
        <section class="janken-section">
            <h2>Challenge！</h2>
            <p class="janken-desc">勝たないと止まらない</p>

            <p class="mainlabel">あなたの手を選んで</p>

            <ul class="jankenbuttons">
                <li id="gu" class="btn">
                    <img src="./img/janken_gu.png" alt="グー">
                </li>

                <li id="cho" class="btn">
                    <img src="./img/janken_cho.png" alt="チョキ">
                </li>

                <li id="par" class="btn">
                    <img src="./img/janken_pa.png" alt="パー">
                </li>
            </ul>

            <div class="resultarea">
                <p class="label">Let'sじゃんけん</p>
                <div class="pc_hand">
                    <img id="pc_image" src="img/placeholder.png" alt="なにかな？">
                </div>
                <!-- 「<span id="pc_hands">これだ！</span>」 -->
                <div id="judgment" class="judgment"></div>
            </div>

            <div id="confetti-container"></div>

        </section>



    </main>


    <script src="js/jquery-2.1.3.min.js"></script>
    <script src="js/alarm.js"></script>



</body>

</html>
